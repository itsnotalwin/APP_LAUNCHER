<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>launcher · custom colors + emoji picker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== ANIMATED GRADIENT BACKGROUND ===== */
    body {
      background: radial-gradient(circle at 20% 30%, #0a0a1a, #000000);
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overscroll-behavior: none;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(125deg, #0f0c29, #302b63, #24243e);
      background-size: 300% 300%;
      animation: gradientShift 12s ease infinite;
      z-index: -2;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* fallback solid */
    :root {
      --bg: transparent;
      --card: rgba(17, 17, 18, 0.85);
      --card-pressed: rgba(28, 28, 30, 0.9);
      --card-shadow: 0 0.5px 0.5px rgba(0,0,0,0.5), 0 1px 1.5px rgba(0,0,0,0.3);
      --text: #f5f5f7;
      --text-secondary: #8e8e93;
      --text-muted: #6c6c70;
      --search-bg: rgba(15, 15, 16, 0.7);
      --search-focus: rgba(26, 26, 28, 0.9);
      --border-subtle: rgba(255,255,255,0.1);
      --radius-card: 20px;
      --radius-search: 12px;
      --grid-gap: 14px;
      --accent: #2c6e9e;  /* default blue, can be overridden by color picker */
    }

    html, body {
      width: 100%;
      font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== BLURRED BACKGROUND SHELL ===== */
    .shell {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding-top: calc(env(safe-area-inset-top) + 14px);
      padding-left: 20px;
      padding-right: 20px;
      padding-bottom: calc(env(safe-area-inset-bottom) + 28px);
      backdrop-filter: blur(14px) saturate(180%);
      background: rgba(0, 0, 0, 0.3);
      border-radius: 0px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--grid-gap);
      width: 100%;
      margin-top: 20px;
    }

    /* cards */
    .app {
      aspect-ratio: 1 / 1;
      background: var(--card);
      border-radius: var(--radius-card);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 8px;
      transition: transform 0.08s cubic-bezier(0.2,0.9,0.4,1.1), background 0.08s ease, box-shadow 0.15s;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      position: relative;
    }
    .app:active {
      transform: scale(0.95);
      background: var(--card-pressed);
    }
    /* DESKTOP HOVER GLOW (uses accent color) */
    @media (hover: hover) {
      .app:hover {
        transform: scale(0.97);
        background: rgba(28, 28, 30, 0.95);
        box-shadow: 0 0 0 2px var(--accent), 0 8px 20px rgba(0,0,0,0.4);
        transition: all 0.15s ease;
      }
    }
    .emoji {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 4px;
      transition: transform 0.05s;
      pointer-events: none; /* so double-click goes to card */
    }
    .label {
      width: 100%;
      text-align: center;
      font-size: 14px;
      font-weight: 510;
      line-height: 1.3;
      color: #efeff4;
      word-break: break-word;
      padding: 0 6px;
      pointer-events: none;
    }

    /* search & accent overrides */
    .search-wrapper { position: relative; width: 100%; }
    #search {
      width: 100%;
      height: 44px;
      border: 0.5px solid var(--border-subtle);
      background: var(--search-bg);
      color: var(--text);
      border-radius: var(--radius-search);
      padding: 0 42px 0 18px;
      font-size: 17px;
      transition: border-color 0.1s, box-shadow 0.1s;
    }
    #search:focus {
      background: var(--search-focus);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
      outline: none;
    }
    .clear-search {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 24px;
      background: rgba(120,120,128,0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }
    .clear-search.visible { opacity: 0.8; pointer-events: auto; }

    .result-meta {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 0.5px solid rgba(255,255,255,0.06);
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* accent color picker row */
    .accent-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.4);
      padding: 4px 12px;
      border-radius: 30px;
    }
    .accent-picker label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    #accentColor {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 30px;
      cursor: pointer;
      background: var(--accent);
    }

    .random-btn {
      background: rgba(44,110,158,0.2);
      border: 0.5px solid var(--accent);
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.1s;
      backdrop-filter: blur(4px);
    }
    .random-btn:active { transform: scale(0.95); background: rgba(44,110,158,0.4); }
    @media (hover: hover) {
      .random-btn:hover { background: rgba(44,110,158,0.3); transform: scale(0.98); }
    }

    .skeleton { background: #151518; position: relative; overflow: hidden; }
    .skeleton::before { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.03) 50%, transparent 70%); animation: shimmer 0.9s infinite; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 0; }
    .footer-meta { margin-top: 40px; display: flex; justify-content: center; gap: 20px; font-size: 12px; color: var(--text-muted); }
    .retry-btn { background: none; border: none; color: var(--text-secondary); font-size: 12px; text-decoration: underline; cursor: pointer; }
    .pull-spinner { width: 14px; height: 14px; border: 1.5px solid rgba(110,110,115,0.5); border-top-color: var(--text-secondary); border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* desktop multi-column (preserved) */
    @media (min-width: 768px) and (max-width: 1023px) { .shell { max-width: 860px; } .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; } .emoji { font-size: 52px; } }
    @media (min-width: 1024px) { .shell { max-width: 1280px; padding-left: 32px; padding-right: 32px; } .grid { grid-template-columns: repeat(4, 1fr); gap: 22px; } .emoji { font-size: 58px; } .label { font-size: 16px; } }
    @media (min-width: 1600px) { .shell { max-width: 1600px; } .grid { grid-template-columns: repeat(5, 1fr); gap: 26px; } .emoji { font-size: 64px; } }
    @media (max-width: 767px) and (orientation: landscape) { .shell { max-width: 700px; } .emoji { font-size: 56px; } }
  </style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <h1>launcher</h1>
    <div class="search-wrapper">
      <input id="search" type="text" placeholder="search tools" autocomplete="off">
      <div class="clear-search" id="clearSearchBtn"><span>✕</span></div>
    </div>
    <div class="result-meta">
      <span id="resultCount"></span>
      <div style="display: flex; gap: 12px; align-items: center;">
        <div class="accent-picker">
          <label>🎨</label>
          <input type="color" id="accentColor" value="#2c6e9e">
        </div>
        <button id="randomBtn" class="random-btn">🎲 random</button>
        <span id="updateCheck" class="update-check"></span>
      </div>
    </div>
  </div>
  <div id="apps" class="grid"></div>
  <div class="footer-meta">
    <span id="timestampText">—</span>
    <div id="pullSpinner" class="pull-spinner"></div>
    <button id="manualRetryBtn" class="retry-btn">retry</button>
  </div>
</div>

<script>
  (function() {
    const USERNAME = "itsnotalwin";
    const appsContainer = document.getElementById("apps");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clearSearchBtn");
    const resultCountSpan = document.getElementById("resultCount");
    const updateCheckSpan = document.getElementById("updateCheck");
    const timestampSpan = document.getElementById("timestampText");
    const pullSpinner = document.getElementById("pullSpinner");
    const retryBtn = document.getElementById("manualRetryBtn");
    const randomBtn = document.getElementById("randomBtn");
    const accentPicker = document.getElementById("accentColor");

    let apps = [];
    let isLoading = true;
    let currentFilter = "";
    let lastUpdated = null;
    let lastFetchTime = 0;
    let refreshingFromForeground = false;

    // ----- localStorage for emoji overrides -----
    let emojiOverrides = {};  // key: repo url (or name as id), value: emoji string

    function loadEmojiOverrides() {
      const stored = localStorage.getItem("launcher_emoji_overrides");
      if (stored) {
        try {
          emojiOverrides = JSON.parse(stored);
        } catch(e) { console.warn(e); }
      }
    }
    function saveEmojiOverrides() {
      localStorage.setItem("launcher_emoji_overrides", JSON.stringify(emojiOverrides));
    }

    // Get emoji for an app (override if exists)
    function getEmojiForApp(app) {
      const key = app.url;   // unique per repo
      if (emojiOverrides[key]) return emojiOverrides[key];
      return app.originalEmoji;
    }

    // ----- accent color management -----
    function setAccentColor(color) {
      document.documentElement.style.setProperty('--accent', color);
      localStorage.setItem("launcher_accent", color);
    }
    function loadAccentColor() {
      const saved = localStorage.getItem("launcher_accent");
      if (saved) {
        setAccentColor(saved);
        accentPicker.value = saved;
      } else {
        setAccentColor("#2c6e9e");
      }
    }
    accentPicker.addEventListener('input', (e) => setAccentColor(e.target.value));

    // ----- fetch repos and emoji mapping (original) -----
    function getCacheBustedUrl() {
      return `https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated&_=${Date.now()}`;
    }

    const emojiMap = {
      tracker:"📊", clock:"⏰", customs:"🧾", dashboard:"📱", secrets:"🔐",
      tools:"🛠️", notes:"📝", camera:"📷", music:"🎵", weather:"🌤️",
      calc:"🧮", finance:"💳", budget:"💰", ai:"🤖", chat:"💬", task:"✅",
      work:"💼", shipping:"🚚", map:"🗺️", portfolio:"🗂️", birthday:"🎂",
      video:"🎬", game:"🎮", project:"📁"
    };
    const fallback = ["📦","🧩","⚙️","🗂️","📁","📌","🪐","🔧"];

    function getEmojiFromName(repoName) {
      const lower = repoName.toLowerCase();
      for (const [key, val] of Object.entries(emojiMap)) {
        if (lower.includes(key)) return val;
      }
      let hash = 0;
      for (let i = 0; i < repoName.length; i++) {
        hash = ((hash << 5) - hash) + repoName.charCodeAt(i);
        hash |= 0;
      }
      return fallback[Math.abs(hash) % fallback.length];
    }

    function escapeHtml(str) {
      return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    function getFilteredApps() {
      const filter = currentFilter.trim().toLowerCase();
      if (!filter) return apps;
      return apps.filter(a => a.name.toLowerCase().includes(filter));
    }

    // render with custom emojis from localStorage
    function renderApps() {
      if (isLoading) {
        appsContainer.innerHTML = '';
        for (let i = 0; i < 6; i++) {
          const skeleton = document.createElement('div');
          skeleton.className = 'app skeleton';
          skeleton.innerHTML = '<div class="emoji">✨</div><div class="label"> </div>';
          appsContainer.appendChild(skeleton);
        }
        resultCountSpan.innerText = '';
        return;
      }

      const filtered = getFilteredApps();
      const total = filtered.length;
      if (apps.length === 0) {
        resultCountSpan.innerText = '';
      } else if (!currentFilter.trim()) {
        resultCountSpan.innerText = `${total} ${total === 1 ? 'tool' : 'tools'}`;
      } else {
        resultCountSpan.innerText = `${total} matching`;
      }

      if (filtered.length === 0) {
        appsContainer.innerHTML = `<div class="empty-state"><div class="empty-icon">${currentFilter ? '🔍' : '📭'}</div><div class="empty-title">${currentFilter ? 'no tools found' : 'no GitHub Pages apps'}</div><div class="empty-hint">${currentFilter ? 'try a different keyword' : 'repositories with "Pages" enabled will appear here'}</div></div>`;
        return;
      }

      appsContainer.innerHTML = '';
      for (const app of filtered) {
        const card = document.createElement('a');
        card.className = 'app';
        card.href = app.url;
        const displayEmoji = getEmojiForApp(app);
        card.innerHTML = `<div class="emoji">${displayEmoji}</div><div class="label">${escapeHtml(app.name)}</div>`;
        // double-click to change emoji
        card.addEventListener('dblclick', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const newEmoji = prompt(`Choose a new emoji for "${app.name}"`, displayEmoji);
          if (newEmoji && newEmoji.trim().length > 0) {
            const emojiChar = newEmoji.trim();
            emojiOverrides[app.url] = emojiChar;
            saveEmojiOverrides();
            renderApps();  // re-render to show new emoji
          }
        });
        card.addEventListener('touchstart', () => { if (navigator.vibrate) navigator.vibrate(5); });
        appsContainer.appendChild(card);
      }
    }

    // ----- fetch GitHub repos (unchanged) -----
    function updateTimestamp() {
      if (!lastUpdated) { timestampSpan.innerText = 'never'; return; }
      const diff = Date.now() - lastUpdated;
      const mins = Math.floor(diff / 60000);
      if (mins < 1) timestampSpan.innerText = 'just now';
      else if (mins < 60) timestampSpan.innerText = `${mins} min ago`;
      else if (mins < 1440) timestampSpan.innerText = `${Math.floor(mins / 60)} hr ago`;
      else timestampSpan.innerText = 'today';
    }

    async function fetchApps(showSpinner = false, silent = false) {
      if (showSpinner) pullSpinner.style.display = 'inline-block';
      if (!silent) {
        isLoading = true;
        renderApps();
      } else {
        updateCheckSpan.innerText = 'checking...';
      }

      try {
        const response = await fetch(getCacheBustedUrl(), { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const repos = await response.json();
        const eligible = repos.filter(r => r.has_pages === true && !r.fork && !r.archived);
        const parsed = eligible.map(repo => {
          let displayName = repo.name.replace(/[-_]/g, ' ').trim();
          displayName = displayName.replace(/\b\w/g, c => c.toUpperCase());
          const originalEmoji = getEmojiFromName(repo.name);
          return {
            name: displayName,
            url: `https://${USERNAME}.github.io/${repo.name}/`,
            originalEmoji: originalEmoji
          };
        });
        parsed.sort((a, b) => a.name.localeCompare(b.name));
        apps = parsed;
        lastUpdated = Date.now();
        lastFetchTime = Date.now();
        updateTimestamp();
        if (!silent) updateCheckSpan.innerText = '';
        else updateCheckSpan.innerText = '✓ updated';
        setTimeout(() => { if (updateCheckSpan.innerText === '✓ updated') updateCheckSpan.innerText = ''; }, 2000);
      } catch (err) {
        console.error(err);
        if (!silent) {
          apps = [];
          appsContainer.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">network error</div><div class="empty-hint">tap "retry"</div></div>`;
        } else {
          updateCheckSpan.innerText = '⚠️ failed';
          setTimeout(() => { if (updateCheckSpan.innerText === '⚠️ failed') updateCheckSpan.innerText = ''; }, 2000);
        }
      } finally {
        isLoading = false;
        if (showSpinner) pullSpinner.style.display = 'none';
        if (!silent) renderApps();
        if (searchInput.value !== currentFilter) {
          currentFilter = searchInput.value;
          renderApps();
        }
      }
    }

    // random global site (unchanged but using new UI)
    async function fetchRandomGlobalPagesSite() {
      const originalText = randomBtn.innerHTML;
      randomBtn.innerHTML = '🌍 searching...';
      randomBtn.style.opacity = '0.7';
      randomBtn.disabled = true;
      try {
        const searchUrl = `https://api.github.com/search/repositories?q=has_pages:true&per_page=30&sort=updated`;
        const response = await fetch(searchUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Search failed`);
        const data = await response.json();
        const totalCount = data.total_count;
        if (totalCount === 0) throw new Error("No Pages sites");
        const maxPage = Math.min(33, Math.floor(totalCount / 30));
        const randomPage = Math.floor(Math.random() * (maxPage + 1)) + 1;
        const pageUrl = `https://api.github.com/search/repositories?q=has_pages:true&per_page=30&sort=updated&page=${randomPage}`;
        const pageResp = await fetch(pageUrl, { cache: 'no-store' });
        if (!pageResp.ok) throw new Error(`Page fetch failed`);
        const pageData = await pageResp.json();
        const repos = pageData.items;
        if (!repos.length) throw new Error("No repos");
        const randomRepo = repos[Math.floor(Math.random() * repos.length)];
        const owner = randomRepo.owner.login;
        const repoName = randomRepo.name;
        const pagesUrl = `https://${owner}.github.io/${repoName}/`;
        updateCheckSpan.innerText = `🎲 ${owner}/${repoName}`;
        setTimeout(() => { if (updateCheckSpan.innerText.includes(owner)) updateCheckSpan.innerText = ''; }, 2500);
        window.open(pagesUrl, '_blank');
        if (navigator.vibrate) navigator.vibrate(10);
      } catch (err) {
        console.error(err);
        updateCheckSpan.innerText = '⚠️ random failed';
        setTimeout(() => { if (updateCheckSpan.innerText === '⚠️ random failed') updateCheckSpan.innerText = ''; }, 2000);
      } finally {
        randomBtn.innerHTML = originalText;
        randomBtn.style.opacity = '1';
        randomBtn.disabled = false;
      }
    }

    randomBtn.addEventListener('click', fetchRandomGlobalPagesSite);

    // Search & clear
    searchInput.addEventListener('input', (e) => {
      currentFilter = e.target.value;
      if (!isLoading) renderApps();
      clearBtn.classList.toggle('visible', currentFilter.length > 0);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentFilter = '';
      clearBtn.classList.remove('visible');
      if (!isLoading) renderApps();
      searchInput.focus();
    });
    retryBtn.addEventListener('click', () => fetchApps(true));

    document.body.addEventListener('touchstart', (e) => {
      if (!e.target.closest('.app') && e.target !== searchInput && !clearBtn.contains(e.target) && !randomBtn.contains(e.target) && !accentPicker.contains(e.target)) {
        searchInput.blur();
      }
    });

    let touchStartY = 0, pulling = false;
    document.body.addEventListener('touchstart', (e) => {
      if (window.scrollY <= 5) touchStartY = e.touches[0].clientY;
    });
    document.body.addEventListener('touchmove', (e) => {
      if (touchStartY && e.touches[0].clientY - touchStartY > 60 && !isLoading) {
        pulling = true;
        e.preventDefault();
        timestampSpan.innerText = 'release to refresh';
      }
    });
    document.body.addEventListener('touchend', async () => {
      if (pulling && !isLoading) {
        pulling = false;
        await fetchApps(true);
        updateTimestamp();
      }
      touchStartY = 0;
      pulling = false;
    });

    window.addEventListener('pageshow', (e) => { if (e.persisted) fetchApps(false, true); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !isLoading && !refreshingFromForeground && (Date.now() - lastFetchTime > 30000)) {
        refreshingFromForeground = true;
        fetchApps(false, true).finally(() => refreshingFromForeground = false);
      }
    });

    // initialise
    loadEmojiOverrides();
    loadAccentColor();
    fetchApps(false);
  })();
</script>
</body>
</html>
