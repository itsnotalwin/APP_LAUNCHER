<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itsnotalwin.github.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #070707;
  --s1:      #0d0d0d;
  --s2:      #141414;
  --s3:      #1c1c1c;
  --b0:      #181818;
  --b1:      #252525;
  --b2:      #333;
  --t0:      #f2f2f2;
  --t1:      #999;
  --t2:      #555;
  --t3:      #2e2e2e;
  --f:       'DM Mono', monospace;
  --r:       0px;
}

html, body {
  background: var(--bg);
  color: var(--t0);
  font-family: var(--f);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

::selection { background: #f2f2f210; }
::-webkit-scrollbar { width: 2px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--b0); }

/* ─────────────────────────────────────────
   TOP BAR
───────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--b0);
  display: flex;
  align-items: center;
  height: 48px;
  padding: 0 28px;
  gap: 20px;
}

.topbar-brand {
  font-size: 12px;
  font-weight: 400;
  color: var(--t2);
  letter-spacing: .04em;
  white-space: nowrap;
  flex-shrink: 0;
}

.topbar-brand span { color: var(--t3); }

.topbar-search {
  flex: 1;
  position: relative;
  max-width: 340px;
}

.topbar-search input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--b0);
  color: var(--t0);
  font-family: var(--f);
  font-size: 12px;
  padding: 6px 0 6px 18px;
  outline: none;
  transition: border-color .15s;
  letter-spacing: .02em;
}

.topbar-search input::placeholder { color: var(--t3); }
.topbar-search input:focus { border-color: var(--b2); }

.search-slash {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--t3);
  pointer-events: none;
  line-height: 1;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.sort-pill {
  background: none;
  border: 1px solid var(--b0);
  color: var(--t2);
  font-family: var(--f);
  font-size: 10px;
  letter-spacing: .08em;
  padding: 5px 11px;
  cursor: pointer;
  transition: all .1s;
  text-transform: lowercase;
}

.sort-pill:hover { border-color: var(--b1); color: var(--t1); }

.sort-pill.on {
  background: var(--t0);
  color: var(--bg);
  border-color: var(--t0);
}

.status-pip {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--b1);
  margin-left: 10px;
  transition: background .4s;
  flex-shrink: 0;
}
.status-pip.spin { animation: pip 1s ease-in-out infinite; }
.status-pip.live { background: #3a5c3a; }
.status-pip.dead { background: #5c3a3a; }

@keyframes pip { 0%,100%{opacity:.3} 50%{opacity:1} }

/* ─────────────────────────────────────────
   HERO
───────────────────────────────────────── */
.hero {
  padding: 52px 28px 40px;
  border-bottom: 1px solid var(--b0);
  max-width: 960px;
  margin: 0 auto;
}

.hero-kicker {
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--t3);
  margin-bottom: 14px;
}

.hero-h1 {
  font-size: clamp(30px, 4.5vw, 48px);
  font-weight: 300;
  letter-spacing: -.025em;
  line-height: 1.05;
  color: var(--t0);
}

.hero-h1 .muted { color: var(--t3); }

.hero-stats {
  margin-top: 22px;
  display: flex;
  flex-wrap: wrap;
  gap: 0;
}

.hstat {
  font-size: 11px;
  color: var(--t2);
  padding-right: 20px;
  margin-right: 20px;
  border-right: 1px solid var(--b0);
}

.hstat:last-child { border-right: none; }
.hstat b { color: var(--t1); font-weight: 400; }

/* ─────────────────────────────────────────
   MAIN LAYOUT
───────────────────────────────────────── */
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 28px 80px;
}

/* ─────────────────────────────────────────
   SECTION LABEL
───────────────────────────────────────── */
.sec {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.sec-name {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--t3);
  white-space: nowrap;
}

.sec-rule { flex: 1; height: 1px; background: var(--b0); }
.sec-n    { font-size: 9px; color: var(--t3); white-space: nowrap; }

/* ─────────────────────────────────────────
   RECENTLY VISITED
───────────────────────────────────────── */
#recentSection { margin-bottom: 40px; display: none; }

.recent-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--b0);
  gap: 0;
}

.r-card {
  background: var(--s1);
  padding: 14px 16px;
  text-decoration: none;
  display: block;
  border-right: 1px solid var(--b0);
  transition: background .12s;
  overflow: hidden;
  position: relative;
}

.r-card:last-child { border-right: none; }
.r-card:hover { background: var(--s2); }

.r-badge {
  font-size: 8px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--t3);
  margin-bottom: 7px;
}

.r-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--t0);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 18px;
}

.r-desc {
  font-size: 10px;
  color: var(--t2);
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.r-arrow {
  position: absolute;
  top: 14px; right: 12px;
  font-size: 10px;
  color: var(--t3);
}

/* ─────────────────────────────────────────
   CARDS GRID
───────────────────────────────────────── */
#cardGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  border: 1px solid var(--b0);
  gap: 0;
}

/* inner border trick without gap */
.card-wrap {
  border-right: 1px solid var(--b0);
  border-bottom: 1px solid var(--b0);
}

.card {
  background: var(--s1);
  padding: 20px 18px 16px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  min-height: 116px;
  position: relative;
  transition: background .12s;
  opacity: 0;
  transform: translateY(6px);
  animation: fadeUp .35s cubic-bezier(.16,1,.3,1) forwards;
}

.card:hover { background: var(--s2); }
.card:hover .c-arrow { opacity: 1; transform: translate(0,0); }

@keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

.c-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.c-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--t0);
  letter-spacing: -.01em;
  line-height: 1.25;
  flex: 1;
}

.c-stars {
  font-size: 10px;
  color: var(--t3);
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
  padding-top: 2px;
}

.c-desc {
  font-size: 11px;
  font-weight: 300;
  color: var(--t2);
  line-height: 1.55;
  flex: 1;
  font-style: italic;
}

.c-foot {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.c-time {
  font-size: 9px;
  color: var(--t3);
  letter-spacing: .04em;
}

.c-tag {
  font-size: 8px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--t3);
  border: 1px solid var(--b0);
  padding: 2px 7px;
}

.c-arrow {
  position: absolute;
  top: 16px; right: 14px;
  font-size: 11px;
  color: var(--t2);
  opacity: 0;
  transform: translate(-3px, 3px);
  transition: all .14s;
}

/* ─────────────────────────────────────────
   STATES
───────────────────────────────────────── */
.state {
  grid-column: 1/-1;
  padding: 60px 0;
  text-align: center;
  font-size: 12px;
  color: var(--t3);
  font-style: italic;
}

.loading-anim::after {
  content: '';
  animation: ldots 1.2s steps(4,end) infinite;
}
@keyframes ldots {
  0%  { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
}

/* ─────────────────────────────────────────
   FILTER TAGS
───────────────────────────────────────── */
.tag-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}

.ftag {
  background: none;
  border: 1px solid var(--b0);
  color: var(--t2);
  font-family: var(--f);
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: lowercase;
  padding: 4px 10px;
  cursor: pointer;
  transition: all .1s;
}

.ftag:hover { border-color: var(--b1); color: var(--t1); }
.ftag.on { background: var(--s2); border-color: var(--b1); color: var(--t0); }

/* ─────────────────────────────────────────
   FOOTER
───────────────────────────────────────── */
.foot {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--b0);
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: .08em;
}

/* ─────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────── */
@media (max-width: 640px) {
  .topbar { padding: 0 16px; }
  .hero   { padding: 36px 16px 28px; }
  .wrap   { padding: 24px 16px 60px; }
  .recent-row { grid-template-columns: 1fr 1fr; }
  .recent-row .r-card:nth-child(2) { border-right: none; }
  .recent-row .r-card:nth-child(3) { display: none; }
  #cardGrid { grid-template-columns: 1fr; }
  .hero-h1 { font-size: 26px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <span class="topbar-brand">itsnotalwin<span>.github.io</span></span>

  <div class="topbar-search">
    <span class="search-slash">/</span>
    <input id="searchInput" type="text" placeholder="filter…" autocomplete="off" spellcheck="false">
  </div>

  <div class="topbar-right">
    <button class="sort-pill on" data-sort="name">a–z</button>
    <button class="sort-pill" data-sort="recent">recent</button>
    <button class="sort-pill" data-sort="stars">★</button>
    <span class="status-pip spin" id="pip"></span>
  </div>
</header>

<!-- HERO -->
<div class="hero">
  <p class="hero-kicker">github pages launcher</p>
  <h1 class="hero-h1">all sites<span class="muted">, one place.</span></h1>
  <div class="hero-stats">
    <span class="hstat" id="hs1"><b>—</b> sites</span>
    <span class="hstat" id="hs2"><b>—</b> total stars</span>
    <span class="hstat" id="hs3">loading…</span>
  </div>
</div>

<!-- MAIN -->
<div class="wrap">

  <!-- Recently visited -->
  <section id="recentSection">
    <div class="sec">
      <span class="sec-name">recently visited</span>
      <div class="sec-rule"></div>
    </div>
    <div class="recent-row" id="recentRow"></div>
  </section>

  <!-- Tag filter -->
  <div class="tag-bar" id="tagBar"></div>

  <!-- All projects -->
  <div class="sec">
    <span class="sec-name">all projects</span>
    <div class="sec-rule"></div>
    <span class="sec-n" id="secCount"></span>
  </div>

  <div id="cardGrid">
    <div class="state loading-anim">fetching repos</div>
  </div>

  <div class="foot">
    <span>itsnotalwin — github pages</span>
    <span id="footR"></span>
  </div>

</div>

<script>
const USER = 'itsnotalwin';
const LS_RECENT = 'alw3_recent';
const LS_SORT   = 'alw3_sort';
const LS_TAG    = 'alw3_tag';

// ── Descriptions ──────────────────────────────────────────────────────────
const DESC_RULES = [
  [/portfolio|personal site|\.io$/,  'personal website & portfolio'],
  [/blog|journal|writing|posts/,     'writing & published thoughts'],
  [/game|puzzle|quiz|play|arcade/,   'browser-based game'],
  [/todo|task|list|note/,            'task & note management tool'],
  [/chat|message|talk/,              'messaging interface'],
  [/music|audio|sound|player/,       'audio & music project'],
  [/weather|forecast/,               'weather dashboard'],
  [/map|geo|location/,               'map & location tool'],
  [/calc|math|convert/,              'calculator or converter'],
  [/timer|clock|stopwatch|pomodoro/, 'time tracking utility'],
  [/draw|paint|canvas|art|sketch/,   'drawing or creative tool'],
  [/dashboard|stats|analytic/,       'data & analytics dashboard'],
  [/tool|util|helper|generator/,     'developer utility'],
  [/doc|wiki|guide/,                 'documentation & reference'],
  [/demo|example|sample|template/,   'demo or starter template'],
  [/css|style|theme|design/,         'CSS & design experiments'],
  [/react|vue|svelte|next/,          'frontend web application'],
  [/extension|chrome|firefox/,       'browser extension'],
  [/api|fetch|data/,                 'data fetching utility'],
];

function describe(name) {
  const n = name.toLowerCase().replace(/[-_.]/g,' ');
  for (const [re, d] of DESC_RULES) if (re.test(n)) return d;
  const w = name.replace(/[-_]/g,' ').trim();
  return w + ' — web project';
}

// ── Category tags ─────────────────────────────────────────────────────────
const TAG_RULES = [
  ['game',      /game|puzzle|quiz|play|arcade/],
  ['tool',      /tool|util|helper|calc|convert|timer|clock/],
  ['creative',  /draw|paint|art|sketch|music|audio|css|design/],
  ['data',      /dashboard|stats|analytic|chart|data|api|fetch/],
  ['web app',   /react|vue|svelte|next|app\b/],
  ['docs',      /doc|wiki|guide|blog|journal|writ/],
  ['demo',      /demo|example|sample|template/],
  ['extension', /extension|chrome|firefox|plugin/],
];

function getTag(name) {
  const n = name.toLowerCase().replace(/[-_.]/g,' ');
  for (const [t, re] of TAG_RULES) if (re.test(n)) return t;
  return 'misc';
}

// ── Time ──────────────────────────────────────────────────────────────────
function rel(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 7)   return d + 'd ago';
  if (d < 30)  return Math.floor(d/7) + 'w ago';
  if (d < 365) return Math.floor(d/30) + 'mo ago';
  return Math.floor(d/365) + 'y ago';
}

// ── Recent ────────────────────────────────────────────────────────────────
const getRecent = () => { try { return JSON.parse(localStorage.getItem(LS_RECENT)||'[]'); } catch { return []; } };

function addRecent(r) {
  let list = getRecent().filter(x => x.name !== r.name);
  list.unshift(r);
  try { localStorage.setItem(LS_RECENT, JSON.stringify(list.slice(0,3))); } catch {}
}

function renderRecent() {
  const list = getRecent();
  const sec  = document.getElementById('recentSection');
  const row  = document.getElementById('recentRow');
  if (!list.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  row.innerHTML = list.map(r => `
    <a class="r-card" href="${r.url}" target="_blank"
       data-name="${r.name}" data-url="${r.url}" data-desc="${(r.desc||'').replace(/"/g,'&quot;')}">
      <div class="r-badge">↩ visited</div>
      <div class="r-name">${r.name}</div>
      <div class="r-desc">${r.desc||''}</div>
      <span class="r-arrow">↗</span>
    </a>`).join('');
  row.querySelectorAll('.r-card').forEach(el =>
    el.addEventListener('click', () => addRecent({name:el.dataset.name, url:el.dataset.url, desc:el.dataset.desc}))
  );
}

// ── Sort ──────────────────────────────────────────────────────────────────
let sortMode  = localStorage.getItem(LS_SORT) || 'name';
let activeTag = localStorage.getItem(LS_TAG)  || 'all';
let allRepos  = [];

document.querySelectorAll('.sort-pill').forEach(btn => {
  btn.classList.toggle('on', btn.dataset.sort === sortMode);
  btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort;
    try { localStorage.setItem(LS_SORT, sortMode); } catch {}
    document.querySelectorAll('.sort-pill').forEach(b => b.classList.toggle('on', b.dataset.sort === sortMode));
    renderCards();
  });
});

document.getElementById('searchInput').addEventListener('input', renderCards);

function sorted(repos) {
  const a = [...repos];
  if (sortMode === 'name')   return a.sort((x,y) => x.name.localeCompare(y.name));
  if (sortMode === 'recent') return a.sort((x,y) => new Date(y.pushed_at) - new Date(x.pushed_at));
  if (sortMode === 'stars')  return a.sort((x,y) => y.stargazers_count - x.stargazers_count);
  return a;
}

// ── Tag bar ───────────────────────────────────────────────────────────────
function buildTags() {
  const counts = {};
  allRepos.forEach(r => { const t = getTag(r.name); counts[t] = (counts[t]||0) + 1; });
  const bar = document.getElementById('tagBar');
  bar.innerHTML = '';

  const make = (id, label, count) => {
    const b = document.createElement('button');
    b.className = 'ftag' + (activeTag === id ? ' on' : '');
    b.dataset.tag = id;
    b.textContent = label + (count !== undefined ? ` (${count})` : '');
    b.addEventListener('click', () => {
      activeTag = id;
      try { localStorage.setItem(LS_TAG, id); } catch {}
      bar.querySelectorAll('.ftag').forEach(x => x.classList.toggle('on', x.dataset.tag === id));
      renderCards();
    });
    bar.appendChild(b);
  };

  make('all', 'all', allRepos.length);
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([id,n]) => make(id, id, n));
}

// ── Render cards ──────────────────────────────────────────────────────────
function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = sorted(allRepos);
  if (q) list = list.filter(r => r.name.toLowerCase().includes(q));
  if (activeTag && activeTag !== 'all') list = list.filter(r => getTag(r.name) === activeTag);

  const grid = document.getElementById('cardGrid');
  document.getElementById('secCount').textContent = `${list.length} / ${allRepos.length}`;
  document.getElementById('footR').textContent = `${list.length} project${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    grid.innerHTML = `<div class="state">no results${q ? ` for "${q}"` : ''}</div>`;
    return;
  }

  grid.innerHTML = list.map((repo, i) => {
    const url  = `https://${USER}.github.io/${repo.name}/`;
    const desc = describe(repo.name);
    const tag  = getTag(repo.name);
    const stars = repo.stargazers_count || 0;
    const delay = Math.min(i * 25, 500);
    return `<div class="card-wrap">
      <a class="card" href="${url}" target="_blank" style="animation-delay:${delay}ms"
         data-name="${repo.name}" data-url="${url}" data-desc="${desc.replace(/"/g,'&quot;')}">
        <span class="c-arrow">↗</span>
        <div class="c-top">
          <div class="c-name">${repo.name}</div>
          ${stars > 0 ? `<div class="c-stars">★ ${stars}</div>` : ''}
        </div>
        <div class="c-desc">${desc}</div>
        <div class="c-foot">
          <span class="c-time">${rel(repo.pushed_at)}</span>
          <span class="c-tag">${tag}</span>
        </div>
      </a>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(el =>
    el.addEventListener('click', () => {
      addRecent({name:el.dataset.name, url:el.dataset.url, desc:el.dataset.desc});
      setTimeout(renderRecent, 100);
    })
  );
}

// ── FETCH — gets ALL repos, keeps those with pages ─────────────────────────
// Strategy: fetch all repos, then ALSO hit the dedicated Pages API to
// cross-reference. Some repos have Pages via Actions where has_pages=false.
// We use both signals: has_pages flag OR presence in the Pages endpoint.
async function fetchAll() {
  const pip = document.getElementById('pip');
  pip.className = 'status-pip spin';

  try {
    // 1. Fetch all repos (paginated)
    let page = 1, raw = [];
    while (true) {
      const res = await fetch(
        `https://api.github.com/users/${USER}/repos?per_page=100&page=${page}&sort=pushed`
      );
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const batch = await res.json();
      if (!batch.length) break;
      raw = raw.concat(batch);
      if (batch.length < 100) break;
      page++;
    }

    // 2. Also try the dedicated Pages API to catch Action-deployed sites
    let pagesNames = new Set();
    try {
      // This endpoint works for public repos: check each repo's pages status
      // We'll just use has_pages + the known pattern: repo name = subdirectory
      // The safest filter: include if has_pages=true OR repo name === username (root site)
      const pagesRes = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&type=public`);
      if (pagesRes.ok) {
        const pd = await pagesRes.json();
        pd.filter(r => r.has_pages).forEach(r => pagesNames.add(r.name));
      }
    } catch {}

    // 3. Merge: keep repos that have has_pages OR show up in pages endpoint
    // Also always include the root site (username.github.io)
    allRepos = raw.filter(r =>
      r.has_pages ||
      pagesNames.has(r.name) ||
      r.name === `${USER}.github.io` ||
      r.name.toLowerCase() === USER.toLowerCase()
    );

    // If the above is empty or very small, fall back to all public repos
    // (better to show too many than none)
    if (allRepos.length < 2) {
      allRepos = raw.filter(r => !r.private && !r.fork);
    }

    pip.className = 'status-pip live';

    const totalStars = allRepos.reduce((s,r) => s + r.stargazers_count, 0);
    document.getElementById('hs1').innerHTML = `<b>${allRepos.length}</b> sites`;
    document.getElementById('hs2').innerHTML = `<b>${totalStars}</b> total stars`;
    document.getElementById('hs3').textContent = `fetched ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;

    buildTags();
    renderCards();
    renderRecent();

  } catch (err) {
    pip.className = 'status-pip dead';
    document.getElementById('cardGrid').innerHTML =
      `<div class="state">error: ${err.message}</div>`;
    document.getElementById('hs3').textContent = 'fetch failed';
  }
}

fetchAll();
</script>
</body>
</html>
