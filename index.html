<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="All of itsnotalwin's GitHub Pages sites — one place to browse, explore, and launch.">
  <meta name="theme-color" content="#050505" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Launchpad">

  <!-- Open Graph -->
  <meta property="og:title" content="Launchpad — itsnotalwin">
  <meta property="og:description" content="All GitHub Pages sites, one place.">
  <meta property="og:type" content="website">

  <title>Launchpad — itsnotalwin</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <style>
/* ─────────────────────────────────────────
   RESET & CUSTOM PROPERTIES
───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Dark theme */
  --bg:     #050505;
  --s1:     #0a0a0a;
  --s2:     #111111;
  --s3:     #181818;
  --b0:     #1c1c1c;
  --b1:     #2a2a2a;
  --b2:     #3a3a3a;
  --t0:     #fcfcfc;
  --t1:     #a0a0a0;
  --t2:     #666;
  --t3:     #333;
  --accent: #fff;
  --f:      'DM Mono', monospace;
  --ease:   cubic-bezier(0.16, 1, 0.3, 1);
  --radius: 3px;
  /* Derived / semantic */
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--b2);
}

[data-theme="light"] {
  --bg:     #f2f0eb;
  --s1:     #fbfaf7;
  --s2:     #f7f5f0;
  --s3:     #f0ede6;
  --b0:     #ddd8cc;
  --b1:     #ccc7bc;
  --b2:     #bbb4a7;
  --t0:     #1a1a1a;
  --t1:     #4a4a4a;
  --t2:     #6e6e6e;
  --t3:     #a09e98;
  --accent: #000;
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--b2);
}

html {
  scroll-behavior: smooth;
  /* Safe area for notched phones */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

body {
  background: var(--bg);
  color: var(--t0);
  font-family: var(--f);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  transition: background 0.3s ease, color 0.3s ease;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Selection */
::selection { background: rgba(128,128,128,0.2); color: var(--t0); }

/* Scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--b1); border-radius: 10px; }

/* Focus visible */
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius); }
:focus:not(:focus-visible) { outline: none; }


/* ─────────────────────────────────────────
   TOPBAR
───────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  /* Slight blur for depth when scrolled */
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--b0);
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 28px;
  gap: 24px;
  /* On scroll, topbar gets a subtle shadow (JS adds .scrolled) */
  transition: box-shadow 0.2s ease;
}
.topbar.scrolled {
  box-shadow: 0 1px 16px rgba(0,0,0,0.4);
}

.topbar-brand {
  font-size: 12px;
  font-weight: 400;
  color: var(--t1);
  letter-spacing: .06em;
  white-space: nowrap;
  flex-shrink: 0;
  transition: color .2s;
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--f);
  padding: 0;
  line-height: 1;
}
.topbar-brand:hover { color: var(--t0); }
.topbar-brand span  { color: var(--t3); }

/* Profile Switcher */
.profile-switcher {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.profile-btn {
  background: var(--s1);
  border: 1px solid var(--b0);
  color: var(--t2);
  font-family: var(--f);
  font-size: 10px;
  letter-spacing: .04em;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  border-radius: 2px;
  line-height: 1.4;
  white-space: nowrap;
}
.profile-btn:hover { border-color: var(--b1); color: var(--t1); }
.profile-btn.active {
  background: var(--t0);
  color: var(--bg);
  border-color: var(--t0);
  font-weight: 500;
}

.profile-divider {
  color: var(--t3);
  font-size: 9px;
  padding: 0 2px;
  user-select: none;
}

/* Word-mark badge */
.topbar-badge {
  font-size: 8px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--t3);
  border: 1px solid var(--b0);
  padding: 2px 7px;
  border-radius: 2px;
  flex-shrink: 0;
  display: none; /* visible on wider viewports via media query */
}
@media (min-width: 640px) { .topbar-badge { display: inline; } }

.topbar-search {
  flex: 1;
  position: relative;
  max-width: 400px;
}

.topbar-search input {
  width: 100%;
  background: var(--s1);
  border: 1px solid var(--b0);
  border-radius: var(--radius);
  color: var(--t0);
  font-family: var(--f);
  font-size: 12px;
  padding: 7px 0 7px 32px;
  outline: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
  letter-spacing: .02em;
}
.topbar-search input::placeholder { color: var(--t3); }
.topbar-search input:focus {
  border-color: var(--b2);
  background: var(--s2);
  box-shadow: 0 0 0 1px var(--b2);
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--t3);
  pointer-events: none;
  user-select: none;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.sort-pill {
  background: none;
  border: 1px solid var(--b0);
  color: var(--t2);
  font-family: var(--f);
  font-size: 10px;
  letter-spacing: .08em;
  padding: 4px 10px;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
  text-transform: lowercase;
  border-radius: 2px;
  line-height: 1.4;
}
.sort-pill:hover { border-color: var(--b1); color: var(--t1); }
.sort-pill.on {
  background: var(--t0);
  color: var(--bg);
  border-color: var(--t0);
}

.theme-toggle {
  background: none;
  border: 1px solid var(--b0);
  color: var(--t2);
  font-family: var(--f);
  font-size: 10px;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 2px;
  transition: border-color .2s, color .2s;
  line-height: 1.4;
}
.theme-toggle:hover { border-color: var(--b1); color: var(--t1); }

.status-pip {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--b1);
  margin-left: 4px;
  transition: background .4s, box-shadow .4s;
  flex-shrink: 0;
  /* Accessible: screen-reader label */
  role: img;
}
.status-pip.spin { animation: pip 1s ease-in-out infinite; }
.status-pip.live { background: #4caf50; box-shadow: 0 0 8px rgba(76,175,80,.4); }
.status-pip.dead { background: #f44336; box-shadow: 0 0 8px rgba(244,67,54,.4); }

@keyframes pip {
  0%, 100% { opacity: .3; }
  50%       { opacity: 1; }
}


/* ─────────────────────────────────────────
   HERO
───────────────────────────────────────── */
.hero {
  padding: 80px 28px 60px;
  border-bottom: 1px solid var(--b0);
  max-width: 1000px;
  margin: 0 auto;
}

.hero-kicker {
  font-size: 10px;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--t2);
  margin-bottom: 16px;
  display: block;
}

.hero-h1 {
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 300;
  letter-spacing: -.03em;
  line-height: 1.1;
  color: var(--t0);
  max-width: 800px;
}
.hero-h1 .muted { color: var(--t3); }

.hero-stats {
  margin-top: 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 0;
}

.hstat {
  font-size: 11px;
  color: var(--t2);
  padding-right: 20px;
  margin-right: 20px;
  border-right: 1px solid var(--b0);
  display: inline-flex;
  align-items: center;
}
.hstat:last-child { border-right: none; }
.hstat b { color: var(--t1); font-weight: 500; margin-right: 4px; }


/* ─────────────────────────────────────────
   LAYOUT & VIEWS
───────────────────────────────────────── */
.wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 48px 28px 100px;
}

.view { display: none; }
.view.active {
  display: block;
  animation: fadeIn .3s var(--ease) forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Section header row */
.sec {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.sec-name { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: var(--t3); white-space: nowrap; }
.sec-rule { flex: 1; height: 1px; background: var(--b0); }
.sec-n    { font-size: 9px; color: var(--t3); white-space: nowrap; }


/* ─────────────────────────────────────────
   RECENTLY VISITED
───────────────────────────────────────── */
#recentSection { margin-bottom: 48px; display: none; }

.recent-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--b0);
}

.r-card {
  background: var(--s1);
  padding: 16px 20px;
  text-decoration: none;
  display: block;
  border-right: 1px solid var(--b0);
  transition: background .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  overflow: hidden;
  position: relative;
  cursor: pointer;
  color: inherit;
}
.r-card:last-child  { border-right: none; }
.r-card:hover {
  background: var(--s2);
  transform: translateY(-2px);
  z-index: 1;
  box-shadow: 0 -1px 0 var(--b1), 0 1px 0 var(--b1);
}

.r-badge { font-size: 8px; letter-spacing: .18em; text-transform: uppercase; color: var(--t3); margin-bottom: 8px; display: block; }
.r-name  { font-size: 13px; font-weight: 500; color: var(--t0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px; }
.r-desc  { font-size: 11px; color: var(--t2); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-arrow { position: absolute; top: 16px; right: 16px; font-size: 10px; color: var(--t3); transition: color .2s, transform .2s; }
.r-card:hover .r-arrow { color: var(--t1); transform: translate(2px, -2px); }


/* ─────────────────────────────────────────
   CARD GRID
───────────────────────────────────────── */
#cardGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  border: 1px solid var(--b0);
}

.card-wrap {
  border-right: 1px solid var(--b0);
  border-bottom: 1px solid var(--b0);
}

.card {
  background: var(--s1);
  padding: 24px 20px 20px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  min-height: 130px;
  position: relative;
  transition: background .2s var(--ease), box-shadow .2s var(--ease);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp .4s var(--ease) forwards;
  cursor: pointer;
  color: inherit;
}
.card:hover {
  background: var(--s2);
  box-shadow: inset 0 0 0 1px var(--b1);
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.c-top  { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.c-name { font-size: 14px; font-weight: 500; color: var(--t0); letter-spacing: -.01em; line-height: 1.3; flex: 1; }
.c-stars {
  font-size: 10px; color: var(--t3); display: flex; align-items: center;
  gap: 4px; flex-shrink: 0; padding-top: 3px;
}

.c-desc { font-size: 12px; font-weight: 300; color: var(--t2); line-height: 1.6; flex: 1; font-style: italic; }

.c-foot { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; }
.c-time { font-size: 9px; color: var(--t3); letter-spacing: .06em; }
.c-tag  {
  font-size: 8px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--t3); border: 1px solid var(--b0); padding: 2px 8px;
  border-radius: 2px; transition: border-color .2s, color .2s;
}
.card:hover .c-tag { border-color: var(--b1); color: var(--t1); }

.c-arrow {
  position: absolute; top: 20px; right: 16px; font-size: 12px;
  color: var(--t2); opacity: 0; transform: translate(-4px, 4px);
  transition: opacity .2s var(--ease), transform .2s var(--ease);
}
.card:hover .c-arrow { opacity: 1; transform: translate(0,0); }


/* ─────────────────────────────────────────
   DETAIL VIEW
───────────────────────────────────────── */
.detail-header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}

.back-btn {
  background: none;
  border: 1px solid var(--b0);
  color: var(--t2);
  font-family: var(--f);
  font-size: 10px;
  padding: 6px 12px;
  cursor: pointer;
  transition: color .2s, border-color .2s;
  border-radius: var(--radius);
}
.back-btn:hover { color: var(--t0); border-color: var(--b1); }

.detail-title {
  font-size: 24px;
  font-weight: 300;
  color: var(--t0);
  letter-spacing: -.02em;
}

.branch-container {
  display: grid;
  grid-template-columns: 250px 1fr;
  gap: 32px;
  min-height: 600px;
}

.branch-list {
  border: 1px solid var(--b0);
  display: flex;
  flex-direction: column;
  border-radius: var(--radius);
  overflow: hidden;
}

.branch-item {
  padding: 12px 16px;
  font-size: 12px;
  color: var(--t2);
  cursor: pointer;
  border-bottom: 1px solid var(--b0);
  transition: color .2s, background .2s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.branch-item:last-child { border-bottom: none; }
.branch-item.on { background: var(--s2); color: var(--t0); border-left: 2px solid var(--t0); }
.branch-item:hover:not(.on) { color: var(--t1); background: var(--s1); }

.timeline {
  position: relative;
  padding-left: 30px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 1px;
  background: var(--b0);
}

.commit-node {
  position: relative;
  margin-bottom: 32px;
  cursor: pointer;
  transition: transform .2s;
}
.commit-node:hover { transform: translateX(4px); }

.commit-dot {
  position: absolute;
  left: -35px; top: 6px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--b1);
  border: 2px solid var(--bg);
  transition: background .2s, box-shadow .2s;
}
.commit-node:hover .commit-dot { background: var(--t0); box-shadow: 0 0 8px rgba(252,252,252,.3); }

.commit-meta {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--t3);
  margin-bottom: 4px;
  letter-spacing: .05em;
}

.commit-msg { font-size: 13px; color: var(--t1); line-height: 1.4; }

.commit-details {
  margin-top: 12px;
  padding: 12px;
  background: var(--s1);
  border: 1px solid var(--b0);
  border-radius: var(--radius);
  font-size: 11px;
  color: var(--t2);
  display: none;
  white-space: pre-wrap;
  line-height: 1.7;
}
.commit-node.open .commit-details { display: block; }
.commit-details a { color: var(--t0); text-decoration: underline; margin-top: 8px; display: block; }


/* ─────────────────────────────────────────
   STATES (empty / loading)
───────────────────────────────────────── */
.state {
  grid-column: 1 / -1;
  padding: 80px 0;
  text-align: center;
  font-size: 12px;
  color: var(--t3);
  font-style: italic;
}

.loading-anim::after {
  content: '';
  animation: ldots 1.2s steps(4, end) infinite;
}
@keyframes ldots {
  0%  { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
}


/* ─────────────────────────────────────────
   TAG / FILTER BAR
───────────────────────────────────────── */
.tag-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.ftag {
  background: none;
  border: 1px solid var(--b0);
  color: var(--t2);
  font-family: var(--f);
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 5px 12px;
  cursor: pointer;
  transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
  border-radius: 2px;
  line-height: 1.4;
}
.ftag:hover { border-color: var(--b1); color: var(--t1); }
.ftag.on {
  background: var(--s2);
  border-color: var(--b1);
  color: var(--t0);
  box-shadow: 0 0 0 1px var(--b1);
}


/* ─────────────────────────────────────────
   FOOTER
───────────────────────────────────────── */
.foot {
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--b0);
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--t3);
  letter-spacing: .08em;
  flex-wrap: wrap;
  gap: 8px;
}


/* ─────────────────────────────────────────
   PWA INSTALL POPUP
───────────────────────────────────────── */
#pwaPopup {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 320px;
  background: var(--s1);
  border: 1px solid var(--b1);
  padding: 20px;
  z-index: 200;
  display: none;
  flex-direction: column;
  gap: 16px;
  border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  animation: slideUp .4s var(--ease) forwards;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.pwa-content { display: flex; align-items: center; gap: 14px; }

.pwa-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--b1); flex-shrink: 0; overflow: hidden;
}
.pwa-icon img { width: 100%; height: 100%; }

.pwa-title  { font-size: 12px; font-weight: 500; color: var(--t0); margin-bottom: 3px; }
.pwa-sub    { font-size: 11px; color: var(--t2); line-height: 1.4; }
.pwa-actions { display: flex; justify-content: flex-end; gap: 12px; }

.pwa-btn {
  font-family: var(--f);
  font-size: 10px;
  padding: 7px 14px;
  cursor: pointer;
  border-radius: 2px;
  transition: opacity .2s, background .2s, border-color .2s;
  letter-spacing: .04em;
  line-height: 1;
}
.btn-cancel  { background: none; border: 1px solid var(--b1); color: var(--t2); }
.btn-cancel:hover { border-color: var(--b2); color: var(--t1); }
.btn-install { background: var(--t0); color: var(--bg); border: none; font-weight: 500; }
.btn-install:hover { opacity: .85; }


/* ─────────────────────────────────────────
   MODE SWITCHER
───────────────────────────────────────── */
.mode-row {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin-bottom: 32px;
}
.mode-label {
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--t3);
}


/* ─────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────── */
@media (max-width: 768px) {
  .topbar  { padding: 0 16px; gap: 12px; }
  .hero    { padding: 52px 16px 36px; }
  .wrap    { padding: 28px 16px 60px; }
  .hero-h1 { font-size: 28px; }

  .recent-row {
    grid-template-columns: 1fr;
  }
  .r-card {
    border-right: none;
    border-bottom: 1px solid var(--b0);
  }
  .r-card:last-child { border-bottom: none; }

  #cardGrid { grid-template-columns: 1fr; }

  .branch-container { grid-template-columns: 1fr; }
  .branch-list { margin-bottom: 24px; }

  #pwaPopup { width: calc(100% - 32px); left: 16px; right: 16px; bottom: 16px; }
}

@media (max-width: 480px) {
  .hero-stats { gap: 8px 0; }
  .hstat { font-size: 10px; padding-right: 14px; margin-right: 14px; }
  .topbar-right .sort-pill { display: none; }

  .topbar-right > *:not(.theme-toggle):not(.status-pip):not([data-sort="name"]) {
    display: none;

  .profile-btn { font-size: 8px; padding: 2px 6px; }
  .profile-divider { font-size: 7px; padding: 0 1px; }
}
  </style>
</head>

<!-- ═══════════════════════════════════════
     SCRIPT
════════════════════════════════════════ -->
<script>
'use strict';

/* ── Constants ─────────────────────────────── */
const PROFILES = ['itsnotalwin', 'alwinnewman97-hue'];
const LS_USER      = 'alw3_user';
const LS_RECENT_BASE = 'alw3_recent'; // will be suffixed with profile
const LS_SORT   = 'alw3_sort';
const LS_TAG    = 'alw3_tag';
const LS_THEME  = 'alw3_theme';
const LS_MODE   = 'alw3_mode';

/* ── State ──────────────────────────────────── */
let currentUser = localStorage.getItem(LS_USER) || 'itsnotalwin';
let currentMode = localStorage.getItem(LS_MODE) || 'explorer';
let sortMode    = localStorage.getItem(LS_SORT)  || 'name';
let activeTag   = localStorage.getItem(LS_TAG)   || 'all';
let allRepos    = [];

// Get profile-specific localStorage keys
function getRecentKey() { return `${LS_RECENT_BASE}_${currentUser}`; }

/* ── Scroll shadow on topbar ────────────────── */
window.addEventListener('scroll', () => {
  document.querySelector('.topbar').classList.toggle('scrolled', window.scrollY > 4);
}, { passive: true });

/* ── PWA ─────────────────────────────────────── */
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const popup = document.getElementById('pwaPopup');
  popup.style.display = 'flex';
  popup.removeAttribute('hidden');
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  closePWA();
});

function closePWA() {
  const popup = document.getElementById('pwaPopup');
  popup.style.display = 'none';
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {/* silently ignore in dev */});
  });
}

/* ── Profile Switcher ────────────────────────── */
function switchProfile(username) {
  if (currentUser === username) return;
  
  currentUser = username;
  localStorage.setItem(LS_USER, currentUser);
  
  // Update profile buttons
  document.querySelectorAll('.profile-btn').forEach(btn => {
    const isActive = btn.dataset.profile === currentUser;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', String(isActive));
  });
  
  // Update badge
  document.getElementById('topbarBadge').textContent = currentUser;
  
  // Update hero and footer
  document.getElementById('heroKicker').textContent = `${currentUser} pages launcher`;
  document.getElementById('footL').textContent = `launchpad — ${currentUser}`;
  
  // Reset search
  document.getElementById('searchInput').value = '';
  
  // Refresh repos for new profile
  fetchAll();
}

function initProfileUI() {
  document.querySelectorAll('.profile-btn').forEach(btn => {
    const isActive = btn.dataset.profile === currentUser;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', String(isActive));
  });
  document.getElementById('topbarBadge').textContent = currentUser;
  document.getElementById('heroKicker').textContent = `${currentUser} pages launcher`;
  document.getElementById('footL').textContent = `launchpad — ${currentUser}`;
}

/* ── Theme ───────────────────────────────────── */
function initTheme() {
  const saved = localStorage.getItem(LS_THEME) || 'dark';
  applyTheme(saved);
}

function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? 'light' : 'dark';
  // Update meta theme-color for browser chrome
  document.getElementById('themeColorMeta').setAttribute(
    'content',
    theme === 'dark' ? '#050505' : '#f2f0eb'
  );
  localStorage.setItem(LS_THEME, theme);
}

document.getElementById('themeToggle').addEventListener('click', () => {
  applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ── Mode ────────────────────────────────────── */
function setMode(mode) {
  currentMode = mode;
  localStorage.setItem(LS_MODE, mode);
  const isExplorer = mode === 'explorer';
  const exBtn = document.getElementById('modeExplorer');
  const laBtn = document.getElementById('modeLauncher');
  exBtn.classList.toggle('on', isExplorer);
  laBtn.classList.toggle('on', !isExplorer);
  exBtn.setAttribute('aria-pressed', String(isExplorer));
  laBtn.setAttribute('aria-pressed', String(!isExplorer));
  renderCards();
}

/* ── Navigation ──────────────────────────────── */
function switchView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const next = document.getElementById(viewId);
  next.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // Move focus for accessibility
  const focusTarget = next.querySelector('button, [href], input, h1');
  if (focusTarget) focusTarget.focus({ preventScroll: true });
}

function goHome() { switchView('viewLauncher'); }

/* ── Description rules ───────────────────────── */
const DESC_RULES = [
  [/portfolio|personal\s?site|\.io$/,  'personal website & portfolio'],
  [/blog|journal|writing|posts/,        'writing & published thoughts'],
  [/game|puzzle|quiz|play|arcade/,      'browser-based game'],
  [/todo|task|list|note/,               'task & note management tool'],
  [/chat|message|talk/,                 'messaging interface'],
  [/music|audio|sound|player/,          'audio & music project'],
  [/weather|forecast/,                  'weather dashboard'],
  [/map|geo|location/,                  'map & location tool'],
  [/calc|math|convert/,                 'calculator or converter'],
  [/timer|clock|stopwatch|pomodoro/,    'time tracking utility'],
  [/draw|paint|canvas|art|sketch/,      'drawing or creative tool'],
  [/dashboard|stats|analytic/,          'data & analytics dashboard'],
  [/tool|util|helper|generator/,        'developer utility'],
  [/doc|wiki|guide/,                    'documentation & reference'],
  [/demo|example|sample|template/,      'demo or starter template'],
  [/css|style|theme|design/,            'CSS & design experiments'],
  [/react|vue|svelte|next/,             'frontend web application'],
  [/extension|chrome|firefox/,          'browser extension'],
  [/api|fetch|data/,                    'data fetching utility'],
];

function describe(name) {
  const n = name.toLowerCase().replace(/[-_.]/g, ' ');
  for (const [re, d] of DESC_RULES) if (re.test(n)) return d;
  return name.replace(/[-_]/g, ' ').trim() + ' — web project';
}

function getTag(name) {
  const TAG_RULES = [
    ['game',      /game|puzzle|quiz|play|arcade/],
    ['tool',      /tool|util|helper|calc|convert|timer|clock/],
    ['creative',  /draw|paint|art|sketch|music|audio|css|design/],
    ['data',      /dashboard|stats|analytic|chart|data|api|fetch/],
    ['web app',   /react|vue|svelte|next|app\b/],
    ['docs',      /doc|wiki|guide|blog|journal|writ/],
    ['demo',      /demo|example|sample|template/],
    ['extension', /extension|chrome|firefox|plugin/],
  ];
  const n = name.toLowerCase().replace(/[-_.]/g, ' ');
  for (const [t, re] of TAG_RULES) if (re.test(n)) return t;
  return 'misc';
}

/* Relative time */
function rel(iso) {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 7)   return d + 'd ago';
  if (d < 30)  return Math.floor(d / 7) + 'w ago';
  if (d < 365) return Math.floor(d / 30) + 'mo ago';
  return Math.floor(d / 365) + 'y ago';
}

/* Escape for inline HTML attributes */
function esc(s) { return String(s).replace(/"/g, '&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Recent ──────────────────────────────────── */
function getRecent() {
  try { return JSON.parse(localStorage.getItem(getRecentKey()) || '[]'); } catch { return []; }
}
function addRecent(r) {
  const list = getRecent().filter(x => x.name !== r.name);
  list.unshift(r);
  try { localStorage.setItem(getRecentKey(), JSON.stringify(list.slice(0, 3))); } catch {}
}
function renderRecent() {
  const list = getRecent();
  const sec  = document.getElementById('recentSection');
  const row  = document.getElementById('recentRow');
  if (!list.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  row.innerHTML = list.map(r => `
    <a class="r-card" href="${esc(r.url)}" rel="noopener noreferrer"
       onclick="event.preventDefault(); openRepo('${esc(r.name)}', '${esc(r.url)}', '${esc(r.desc||'')}')"
       role="listitem">
      <span class="r-badge" aria-hidden="true">↩ visited</span>
      <div class="r-name">${esc(r.name)}</div>
      <div class="r-desc">${esc(r.desc || '')}</div>
      <span class="r-arrow" aria-hidden="true">↗</span>
    </a>`).join('');
}

/* ── Sort ─────────────────────────────────────── */
document.querySelectorAll('.sort-pill[data-sort]').forEach(btn => {
  btn.classList.toggle('on', btn.dataset.sort === sortMode);
  btn.setAttribute('aria-pressed', String(btn.dataset.sort === sortMode));
  btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort;
    try { localStorage.setItem(LS_SORT, sortMode); } catch {}
    document.querySelectorAll('.sort-pill[data-sort]').forEach(b => {
      const on = b.dataset.sort === sortMode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    renderCards();
  });
});

document.getElementById('searchInput').addEventListener('input', renderCards);

function sorted(repos) {
  const a = [...repos];
  if (sortMode === 'name')   return a.sort((x, y) => x.name.localeCompare(y.name));
  if (sortMode === 'recent') return a.sort((x, y) => new Date(y.pushed_at) - new Date(x.pushed_at));
  if (sortMode === 'stars')  return a.sort((x, y) => y.stargazers_count - x.stargazers_count);
  return a;
}

/* ── Tag bar ─────────────────────────────────── */
function buildTags() {
  const counts = {};
  allRepos.forEach(r => { const t = getTag(r.name); counts[t] = (counts[t] || 0) + 1; });
  const bar = document.getElementById('tagBar');
  bar.innerHTML = '';

  const make = (id, label, count) => {
    const b = document.createElement('button');
    b.className = 'ftag' + (activeTag === id ? ' on' : '');
    b.dataset.tag = id;
    b.textContent = count !== undefined ? `${label} (${count})` : label;
    b.setAttribute('aria-pressed', String(activeTag === id));
    b.addEventListener('click', () => {
      activeTag = id;
      try { localStorage.setItem(LS_TAG, id); } catch {}
      bar.querySelectorAll('.ftag').forEach(x => {
        const on = x.dataset.tag === id;
        x.classList.toggle('on', on);
        x.setAttribute('aria-pressed', String(on));
      });
      renderCards();
    });
    bar.appendChild(b);
  };

  make('all', 'all', allRepos.length);
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([id, n]) => make(id, id, n));
}

/* ── Render cards ────────────────────────────── */
function renderCards() {
  const q    = document.getElementById('searchInput').value.toLowerCase().trim();
  let   list = sorted(allRepos);
  if (q)                               list = list.filter(r => r.name.toLowerCase().includes(q));
  if (activeTag && activeTag !== 'all') list = list.filter(r => getTag(r.name) === activeTag);

  const grid = document.getElementById('cardGrid');
  document.getElementById('secCount').textContent = `${list.length} / ${allRepos.length}`;
  document.getElementById('footR').textContent    = `${list.length} project${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    grid.innerHTML = `<div class="state" role="status">no results${q ? ` for "${esc(q)}"` : ''}</div>`;
    return;
  }

  grid.innerHTML = list.map((repo, i) => {
    const url   = `https://${currentUser}.github.io/${repo.name}/`;
    const desc  = describe(repo.name);
    const tag   = getTag(repo.name);
    const stars = repo.stargazers_count || 0;
    const delay = Math.min(i * 30, 600);
    return `<div class="card-wrap" role="listitem">
      <a class="card" style="animation-delay:${delay}ms"
         href="${esc(url)}"
         onclick="handleCardClick(event,'${esc(repo.name)}','${esc(url)}','${esc(desc)}')"
         aria-label="${esc(repo.name)} — ${esc(desc)}">
        <span class="c-arrow" aria-hidden="true">↗</span>
        <div class="c-top">
          <div class="c-name">${esc(repo.name)}</div>
          ${stars > 0 ? `<div class="c-stars" aria-label="${stars} stars">★ ${stars}</div>` : ''}
        </div>
        <div class="c-desc">${esc(desc)}</div>
        <div class="c-foot">
          <span class="c-time">${rel(repo.pushed_at)}</span>
          <span class="c-tag">${esc(tag)}</span>
        </div>
      </a>
    </div>`;
  }).join('');
}

function handleCardClick(e, name, url, desc) {
  e.preventDefault();
  if (currentMode === 'launcher') {
    window.open(url, '_blank', 'noopener,noreferrer');
    addRecent({ name, url, desc });
    renderRecent();
  } else {
    openRepo(name, url, desc);
  }
}

/* ── Detail view ─────────────────────────────── */
async function openRepo(name, url, desc) {
  addRecent({ name, url, desc });
  renderRecent();

  document.getElementById('detRepoName').textContent = name;
  switchView('viewDetail');

  const branchList = document.getElementById('branchList');
  const timeline   = document.getElementById('commitTimeline');
  branchList.innerHTML = `<div class="state loading-anim">fetching branches</div>`;
  timeline.innerHTML   = `<div class="state">select a branch to see history</div>`;

  try {
    const res     = await fetch(`https://api.github.com/repos/${currentUser}/${name}/branches`);
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const branches = await res.json();

    if (!branches.length) {
      branchList.innerHTML = `<div class="state">no branches found</div>`;
      return;
    }

    branchList.innerHTML = branches.map((b, i) => `
      <div class="branch-item ${i === 0 ? 'on' : ''}"
           data-branch="${esc(b.name)}"
           role="button"
           tabindex="0"
           onclick="selectBranch('${esc(name)}','${esc(b.name)}',this)"
           onkeydown="if(event.key==='Enter'||event.key===' ')selectBranch('${esc(name)}','${esc(b.name)}',this)">
        <span aria-hidden="true" style="opacity:.5">⑂</span>${esc(b.name)}
      </div>`).join('');

    selectBranch(name, branches[0].name, branchList.querySelector('.branch-item'));
  } catch (err) {
    branchList.innerHTML = `<div class="state">error: ${esc(err.message)}</div>`;
  }
}

async function selectBranch(repo, branch, el) {
  document.querySelectorAll('.branch-item').forEach(i => i.classList.remove('on'));
  el.classList.add('on');

  const timeline = document.getElementById('commitTimeline');
  timeline.innerHTML = `<div class="state loading-anim">loading commits</div>`;

  try {
    const res = await fetch(`https://api.github.com/repos/${currentUser}/${repo}/commits?sha=${encodeURIComponent(branch)}&per_page=20`);
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const commits = await res.json();

    if (!commits.length) {
      timeline.innerHTML = `<div class="state">no commits found on this branch</div>`;
      return;
    }

    timeline.innerHTML = commits.map(c => {
      const sha  = c.sha.substring(0, 7);
      const date = rel(c.commit.author.date);
      const msg  = esc(c.commit.message.split('\n')[0]); // first line only
      const full = esc(c.commit.message);
      return `
        <div class="commit-node"
             onclick="this.classList.toggle('open')"
             onkeydown="if(event.key==='Enter')this.classList.toggle('open')"
             role="button"
             tabindex="0"
             aria-expanded="false"
             aria-label="${msg}">
          <div class="commit-dot" aria-hidden="true"></div>
          <div class="commit-meta">
            <span>${sha}</span>
            <span>${date}</span>
          </div>
          <div class="commit-msg">${msg}</div>
          <div class="commit-details">
<strong>Author:</strong> ${esc(c.commit.author.name)} &lt;${esc(c.commit.author.email)}&gt;
<strong>Date:</strong>   ${c.commit.author.date}
<strong>SHA:</strong>    ${c.sha}
<a href="https://github.com/${currentUser}/${repo}/commit/${c.sha}" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
          </div>
        </div>`;
    }).join('');

    // Toggle aria-expanded on click
    timeline.querySelectorAll('.commit-node').forEach(node => {
      node.addEventListener('click', () => {
        node.setAttribute('aria-expanded', String(node.classList.contains('open')));
      });
    });
  } catch (err) {
    timeline.innerHTML = `<div class="state">error: ${esc(err.message)}</div>`;
  }
}

/* ── Fetch all repos ─────────────────────────── */
async function fetchAll() {
  const pip = document.getElementById('pip');
  pip.className = 'status-pip spin';
  pip.setAttribute('aria-label', 'Loading repositories…');

  try {
    let page = 1, raw = [];
    while (true) {
      const res = await fetch(`https://api.github.com/users/${currentUser}/repos?per_page=100&page=${page}&sort=pushed`);
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const batch = await res.json();
      if (!batch.length) break;
      raw = raw.concat(batch);
      if (batch.length < 100) break;
      page++;
    }

    // Get pages-enabled repos
    const pagesNames = new Set();
    try {
      const pagesRes = await fetch(`https://api.github.com/users/${currentUser}/repos?per_page=100&type=public`);
      if (pagesRes.ok) {
        const pd = await pagesRes.json();
        pd.filter(r => r.has_pages).forEach(r => pagesNames.add(r.name));
      }
    } catch {}

    allRepos = raw.filter(r =>
      r.has_pages ||
      pagesNames.has(r.name) ||
      r.name === `${currentUser}.github.io` ||
      r.name.toLowerCase() === currentUser.toLowerCase()
    );
    // Fallback: show all public non-fork repos
    if (allRepos.length < 2) allRepos = raw.filter(r => !r.private && !r.fork);

    pip.className = 'status-pip live';
    pip.setAttribute('aria-label', 'Repositories loaded');

    const totalStars = allRepos.reduce((s, r) => s + r.stargazers_count, 0);
    document.getElementById('hs1').querySelector('.val').textContent = allRepos.length;
    document.getElementById('hs2').querySelector('.val').textContent = totalStars;
    document.getElementById('hs3').textContent =
      `fetched ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

    buildTags();
    renderCards();
    renderRecent();
  } catch (err) {
    pip.className = 'status-pip dead';
    pip.setAttribute('aria-label', 'Error loading repositories');
    document.getElementById('cardGrid').innerHTML =
      `<div class="state" role="alert">error: ${esc(err.message)}</div>`;
    document.getElementById('hs3').textContent = 'fetch failed';
  }
}

/* ── Boot ────────────────────────────────────── */
initTheme();
initProfileUI();
setMode(currentMode);
fetchAll();
</script>
</body>
</html>
