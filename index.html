<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alwin.pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080808;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --border: #222222;
    --border-hover: #3a3a3a;
    --text: #f0f0f0;
    --text-dim: #666666;
    --text-mid: #999999;
    --accent: #f0f0f0;
    --font: 'DM Mono', monospace;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ── */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* ── Header ── */
  header {
    margin-bottom: 52px;
  }

  .site-title {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .site-heading {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text);
  }

  .site-heading span {
    color: var(--text-dim);
  }

  /* ── Search ── */
  .search-wrap {
    margin-bottom: 40px;
    position: relative;
  }

  .search-label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .search-inner {
    position: relative;
  }

  .search-prefix {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--text-dim);
    pointer-events: none;
    font-family: var(--font);
  }

  #search {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 400;
    padding: 14px 16px 14px 36px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    appearance: none;
  }

  #search::placeholder {
    color: var(--text-dim);
  }

  #search:focus {
    border-color: var(--border-hover);
    background: var(--bg3);
  }

  /* ── Sort toggle ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }

  .sort-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .sort-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.12s;
    text-transform: lowercase;
  }

  .sort-btn:hover {
    border-color: var(--border-hover);
    color: var(--text);
  }

  .sort-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* ── Section headers ── */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .section-count {
    font-size: 11px;
    color: #333;
  }

  .section-divider {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Recently visited ── */
  .recent-section {
    margin-bottom: 48px;
  }

  .recent-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }

  .recent-card {
    background: var(--bg2);
    padding: 18px 20px;
    text-decoration: none;
    display: block;
    position: relative;
    transition: background 0.12s;
    overflow: hidden;
  }

  .recent-card:hover {
    background: var(--bg3);
  }

  .recent-card::before {
    content: 'visited';
    position: absolute;
    top: 14px;
    right: 14px;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #2a2a2a;
  }

  .recent-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .recent-desc {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Main grid ── */
  .grid-section {
    margin-bottom: 48px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }

  .card {
    background: var(--bg2);
    padding: 24px 22px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    transition: background 0.12s;
    cursor: pointer;
    min-height: 110px;
  }

  .card:hover {
    background: var(--bg3);
  }

  .card:hover .card-arrow {
    opacity: 1;
    transform: translate(0, 0);
  }

  .card-index {
    font-size: 10px;
    color: #2a2a2a;
    letter-spacing: 0.05em;
    position: absolute;
    top: 12px;
    right: 14px;
    font-weight: 300;
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
    line-height: 1.3;
    padding-right: 24px;
  }

  .card-desc {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-mid);
    line-height: 1.5;
    flex: 1;
  }

  .card-arrow {
    position: absolute;
    bottom: 14px;
    right: 16px;
    font-size: 12px;
    color: var(--text-dim);
    opacity: 0;
    transform: translate(-4px, 4px);
    transition: all 0.15s;
  }

  /* ── Empty / loading states ── */
  .state-msg {
    grid-column: 1 / -1;
    padding: 48px 24px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
  }

  .loading-dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }

  /* ── Footer ── */
  footer {
    padding-top: 32px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #333;
    letter-spacing: 0.06em;
  }

  .footer-count {
    color: var(--text-dim);
  }

  /* ── No results ── */
  .no-results {
    padding: 60px 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  @media (max-width: 600px) {
    .recent-grid { grid-template-columns: 1fr 1fr; }
    .container { padding: 36px 16px 60px; }
    .site-heading { font-size: 28px; }
  }
  @media (max-width: 400px) {
    .recent-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <p class="site-title">github pages launcher</p>
    <h1 class="site-heading">itsnotalwin<span>.github.io</span></h1>
  </header>

  <div class="search-wrap">
    <label class="search-label" for="search">filter</label>
    <div class="search-inner">
      <span class="search-prefix">/</span>
      <input id="search" type="text" placeholder="search projects..." autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="controls">
    <span class="sort-label">sort by</span>
    <button class="sort-btn active" data-sort="name">name</button>
    <button class="sort-btn" data-sort="recent">recent</button>
  </div>

  <!-- Recently visited -->
  <section class="recent-section" id="recentSection" style="display:none">
    <div class="section-header">
      <span class="section-title">recently visited</span>
      <div class="section-divider"></div>
    </div>
    <div class="recent-grid" id="recentGrid"></div>
  </section>

  <!-- All sites -->
  <section class="grid-section">
    <div class="section-header">
      <span class="section-title">all projects</span>
      <span class="section-count" id="countLabel"></span>
      <div class="section-divider"></div>
    </div>
    <div class="card-grid" id="cardGrid">
      <div class="state-msg loading-dots">fetching</div>
    </div>
  </section>

  <footer>
    <span>itsnotalwin — github pages</span>
    <span class="footer-count" id="footerCount"></span>
  </footer>

</div>

<script>
const USERNAME = 'itsnotalwin';
const RECENT_KEY = 'alwin_launcher_recent';
const SORT_KEY = 'alwin_launcher_sort';

// ── Description generator ──────────────────────────────────────────────────
function describeRepo(name) {
  const n = name.toLowerCase().replace(/[-_.]/g, ' ');
  const rules = [
    [/portfolio|personal|site|www/, 'personal website & portfolio'],
    [/blog|journal|posts|writing/, 'writing & thoughts'],
    [/game|puzzle|quiz|play|arcade/, 'browser-based game'],
    [/todo|task|list|notes?|note-?taking/, 'task & note management'],
    [/chat|message|talk|discord/, 'messaging or chat interface'],
    [/music|audio|sound|player|spotify/, 'audio & music tool'],
    [/weather|forecast|climate/, 'weather dashboard'],
    [/map|geo|location|place/, 'map & location tool'],
    [/calc|math|convert|unit/, 'calculator or converter'],
    [/timer|clock|stopwatch|pomodoro/, 'time tracking utility'],
    [/draw|paint|canvas|art|sketch/, 'drawing or creative tool'],
    [/dashboard|stats|analytic|metrics/, 'data & analytics dashboard'],
    [/api|fetch|scrape|data/, 'data fetching utility'],
    [/tool|util|helper|gen|generator/, 'developer utility'],
    [/doc|wiki|guide|docs/, 'documentation & guides'],
    [/demo|example|sample|template/, 'demo or starter template'],
    [/css|style|theme|design/, 'CSS experiments & styling'],
    [/js|javascript|script/, 'JavaScript project'],
    [/react|vue|svelte|next/, 'frontend web app'],
    [/python|py/, 'Python project'],
    [/api/, 'API integration'],
    [/extension|chrome|firefox/, 'browser extension'],
  ];
  for (const [re, desc] of rules) {
    if (re.test(n)) return desc;
  }
  const words = name.replace(/[-_]/g, ' ').split(' ').filter(Boolean);
  if (words.length === 1) return `${words[0]} — web project`;
  return words.slice(0, 3).join(' ') + ' — web project';
}

// ── Recent visited ─────────────────────────────────────────────────────────
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
  catch { return []; }
}
function addRecent(repo) {
  let list = getRecent().filter(r => r.name !== repo.name);
  list.unshift(repo);
  list = list.slice(0, 3);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch {}
}
function renderRecent() {
  const list = getRecent();
  const section = document.getElementById('recentSection');
  const grid = document.getElementById('recentGrid');
  if (!list.length) { section.style.display = 'none'; return; }
  section.style.display = '';
  grid.innerHTML = list.map(r => `
    <a class="recent-card" href="${r.url}" target="_blank" data-name="${r.name}" data-url="${r.url}" data-desc="${r.desc}">
      <div class="recent-name">${r.name}</div>
      <div class="recent-desc">${r.desc}</div>
    </a>
  `).join('');
  grid.querySelectorAll('.recent-card').forEach(el => {
    el.addEventListener('click', () => addRecent({ name: el.dataset.name, url: el.dataset.url, desc: el.dataset.desc }));
  });
}

// ── Sort state ─────────────────────────────────────────────────────────────
let sortMode = localStorage.getItem(SORT_KEY) || 'name';
let allRepos = [];

document.querySelectorAll('.sort-btn').forEach(btn => {
  if (btn.dataset.sort === sortMode) btn.classList.add('active');
  else btn.classList.remove('active');

  btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort;
    try { localStorage.setItem(SORT_KEY, sortMode); } catch {}
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === sortMode));
    renderCards(allRepos);
  });
});

// ── Sort repos ─────────────────────────────────────────────────────────────
function sortRepos(repos) {
  if (sortMode === 'name') {
    return [...repos].sort((a, b) => a.name.localeCompare(b.name));
  } else {
    return [...repos].sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
  }
}

// ── Search ─────────────────────────────────────────────────────────────────
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => renderCards(allRepos));

// ── Render cards ───────────────────────────────────────────────────────────
function renderCards(repos) {
  const query = searchEl.value.toLowerCase().trim();
  const sorted = sortRepos(repos);
  const filtered = query ? sorted.filter(r => r.name.toLowerCase().includes(query)) : sorted;

  const grid = document.getElementById('cardGrid');
  const countLabel = document.getElementById('countLabel');
  const footerCount = document.getElementById('footerCount');

  countLabel.textContent = `${filtered.length}`;
  footerCount.textContent = `${filtered.length} of ${repos.length} sites`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="state-msg">no projects match "${query}"</div>`;
    return;
  }

  grid.innerHTML = filtered.map((repo, i) => {
    const url = `https://${USERNAME}.github.io/${repo.name}/`;
    const desc = describeRepo(repo.name);
    const idx = String(i + 1).padStart(2, '0');
    return `
      <a class="card" href="${url}" target="_blank"
         data-name="${repo.name}" data-url="${url}" data-desc="${desc.replace(/"/g, '&quot;')}">
        <span class="card-index">${idx}</span>
        <div class="card-name">${repo.name}</div>
        <div class="card-desc">${desc}</div>
        <span class="card-arrow">↗</span>
      </a>
    `;
  }).join('');

  grid.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      addRecent({ name: el.dataset.name, url: el.dataset.url, desc: el.dataset.desc });
      setTimeout(renderRecent, 200);
    });
  });
}

// ── Fetch repos ────────────────────────────────────────────────────────────
async function fetchRepos() {
  try {
    let page = 1, repos = [];
    while (true) {
      const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}`);
      if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
      const batch = await res.json();
      if (!batch.length) break;
      repos = repos.concat(batch.filter(r => r.has_pages));
      if (batch.length < 100) break;
      page++;
    }
    allRepos = repos;
    renderCards(allRepos);
    renderRecent();
  } catch (err) {
    document.getElementById('cardGrid').innerHTML =
      `<div class="state-msg">failed to load — ${err.message}</div>`;
  }
}

fetchRepos();
</script>
</body>
</html>
